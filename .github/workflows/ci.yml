name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    # Windows runner bắt buộc: solution có project WPF (net9.0-windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AM.AutoFrame.sln

      - name: Build (TreatWarningsAsErrors=true)
        run: dotnet build AM.AutoFrame.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AM.AutoFrame.sln --configuration Release --no-build --verbosity normal
